name: deploy-pages
on:
  push:
    branches: [main]
    # Anything that can change the published site. Docs, end-to-end specs, unit tests and the test fixtures cannot
    # (the negations come last: they subtract from the patterns above).
    paths:
      - 'web/**'
      - 'data/**'
      - 'editions/**'
      - '.github/workflows/deploy.yml'
      - '!web/docs/**'
      - '!web/e2e/**'
      - '!web/fixtures/**'
      - '!web/**/*.test.ts'
      - '!web/**/*.test.tsx'
      - '!web/playwright*.config.ts'
      - '!web/README.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      # No `npm test` here (private#201): the unit tests run in the `ci` workflow, and the `ci-green` job below
      # keeps the deploy from going out unless that workflow is green on this same commit.
      - name: Cache the link-preview rasters
        uses: actions/cache@v4
        with:
          path: web/.cache/previews
          # Content-addressed (private#201): integrations/preview-images.ts names every cached raster by the digest of its
          # own picture, so a restored folder can never serve a stale picture and a prefix restore is safe. The key
          # holds only what changes a picture: the code that draws it (not its tests) and the city tables. data/manifest.json
          # (national references) is left out, so a commit that touches only it restores the cache whole. A change to a
          # table or to the drawing saves a new entry; the restore-key starts it from the latest one, and the build
          # redraws only the pictures whose digest is new.
          key: previews-${{ hashFiles('web/integrations/preview-images.ts', 'web/src/lib/link-preview.ts', 'web/src/lib/share-*.ts', 'web/src/lib/stat-card.ts', 'web/src/lib/city-shard.ts', 'web/src/lib/sentences/**', 'web/src/shared/city-model.ts', 'web/src/data/**', 'web/src/slots/city/city-view.ts', 'web/package-lock.json', 'data/candidates.csv', 'data/cities.csv', 'data/turnout.csv', 'data/votes.csv', '!**/*.test.ts') }}
          restore-keys: previews-
      - name: Build static site
        run: npm run build
        env:
          # Custom domain (web/public/CNAME): the site is served at the apex, so the base is "/".
          SITE_BASE: /
          # Scheme + host used by the share/QR/preview URLs (src/lib/share-url.ts).
          SITE_ORIGIN: https://voto-a-voto.com
          # The committed TSE dataset (5,570 cities) — the walking skeleton's real pages.
          DATA_DIR: ../data
          # Ticket #20 consent-first GA4: Astro inlines only PUBLIC_-prefixed vars into client
          # bundles; empty/unset keeps analytics a strict no-op.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          # Ticket #36: the donation page address (https). Unset or empty: the donation link is not drawn anywhere.
          PUBLIC_DONATION_URL: ${{ vars.PUBLIC_DONATION_URL }}
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first deploy instead of failing if it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # The deploy follows a green `ci` of the same commit (private#201). The build above runs in parallel and does not
  # wait; only the publish does. A `workflow_dispatch` run is checked the same way, on the commit it was started from.
  ci-green:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the ci workflow of this commit and require it green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 60); do
            read -r status conclusion < <(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] // {status: "missing", conclusion: ""} | "\(.status) \(.conclusion)"')
            echo "ci on $GITHUB_SHA: status=$status conclusion=${conclusion:-none} (check $attempt of 60)"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::the ci workflow of this commit ended as $conclusion; fix it before deploying"
              exit 1
            fi
            sleep 30
          done
          echo "::error::the ci workflow of this commit did not finish in 30 minutes"
          exit 1

  deploy:
    needs: [build, ci-green]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4