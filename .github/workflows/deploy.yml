name: deploy-pages
on:
  push:
    branches: [main]
    # Anything that can change the published site. Docs, end-to-end specs, unit tests and the test fixtures cannot
    # (the negations come last: they subtract from the patterns above).
    paths:
      - 'web/**'
      - 'data/**'
      - 'editions/**'
      - '.github/workflows/deploy.yml'
      - '!web/docs/**'
      - '!web/e2e/**'
      - '!web/fixtures/**'
      - '!web/**/*.test.ts'
      - '!web/**/*.test.tsx'
      - '!web/playwright*.config.ts'
      - '!web/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Cache the link-preview rasters
        uses: actions/cache@v4
        with:
          path: web/.cache/previews
          # Exact match only, no restore-keys: the build reuses a cached raster by its city path alone, so a raster
          # drawn by older code or from an older dataset must never be restored. The key is the dataset (its manifest
          # holds the digest of every table) plus the code that draws the picture (integrations/preview-images.ts,
          # link-preview, share-card and its sentences, the city model); tests are left out so editing one does not
          # throw the cache away.
          key: previews-${{ hashFiles('data/manifest.json', 'web/integrations/preview-images.ts', 'web/src/lib/link-preview.ts', 'web/src/lib/share-*.ts', 'web/src/lib/stat-card.ts', 'web/src/lib/city-shard.ts', 'web/src/lib/sentences/**', 'web/src/shared/city-model.ts', 'web/src/data/**', 'web/src/slots/city/city-view.ts', '!**/*.test.ts') }}
      - name: Build static site
        run: npm run build
        env:
          # Custom domain (web/public/CNAME): the site is served at the apex, so the base is "/".
          SITE_BASE: /
          # Scheme + host used by the share/QR/preview URLs (src/lib/share-url.ts).
          SITE_ORIGIN: https://voto-a-voto.com
          # The committed TSE dataset (5,570 cities) — the walking skeleton's real pages.
          DATA_DIR: ../data
          # Ticket #20 consent-first GA4: Astro inlines only PUBLIC_-prefixed vars into client
          # bundles; empty/unset keeps analytics a strict no-op.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          # Ticket #36: the donation page address (https). Unset or empty: the donation link is not drawn anywhere.
          PUBLIC_DONATION_URL: ${{ vars.PUBLIC_DONATION_URL }}
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first deploy instead of failing if it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4