name: deploy-pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          # Project site at https://<user>.github.io/voto-a-voto-oss/. Use "/" with a custom domain.
          SITE_BASE: /voto-a-voto-oss/
          # The committed TSE dataset (5,570 cities) — the walking skeleton's real pages.
          DATA_DIR: ../data
          # Ticket #20 consent-first GA4: Astro inlines only PUBLIC_-prefixed vars into client
          # bundles; empty/unset keeps analytics a strict no-op.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first deploy instead of failing if it does not exist yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4