name: ci
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Behaviour only: route smoke, scoped search, 390 px layout. Screenshot captures are per checkpoint and not run in CI.
      - run: npm run test:e2e
      - name: e2e under the GitHub Pages base path
        run: npm run test:e2e
        env:
          SITE_BASE: /voto-a-voto-oss/
          # A donation address (a placeholder: no real one is committed) so this pass exercises the link; the first pass has none.
          PUBLIC_DONATION_URL: https://doacao.example.test/apoie
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results