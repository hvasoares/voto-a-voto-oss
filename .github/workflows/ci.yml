name: ci
on:
  push:
  pull_request:

jobs:
  # pytest. Hermético num runner limpo: uv sync --frozen lê o uv.lock; os testes marcados
  # network_cache pulam sem .cache/ (pyproject.toml) e o "-ra" imprime os pulados, então um
  # mass-skip silencioso aparece no log. Versão do Python nomeada uma vez: vem do
  # requires-python (>= 3.12) do pyproject.toml via `uv python install`. Local: `make pytest`.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run pytest -ra

  # typecheck + vitest (os testes unitários do web). Local: `make typecheck web-test`.
  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # e2e base "/" + check:perf. O webServer do Playwright constrói o site (OUT_DIR default dist) e o
  # check:perf mede ESSE build — o build de FIXTURE (base "/", dados locais de web/fixtures/data, modo
  # local). Builds de dados reais não passam pelo orçamento: são maiores e não são construídos no CI (#107).
  # Local: `make browser e2e perf`.
  e2e-root:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Behaviour only: route smoke, scoped search, 390 px layout. Screenshot captures are per checkpoint and not run in CI.
      - run: npm run test:e2e
      # if: always(): roda mesmo com e2e vermelho. Lê o web/dist que o webServer construiu acima (o script
      # lança "route not built" se dist ou uma rota faltar, então não passa no vácuo) e o output — medido /
      # orçamento por métrica — vai para o resumo da run (a margem visível no verde). Local: `make perf`.
      - name: check:perf on the fixture build (base /)
        if: always()
        run: npm run check:perf 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-root
          path: web/test-results

  # e2e base "/voto-a-voto-oss/" — a segunda passada precisa do próprio build (SITE_BASE fixa os caminhos
  # no bundle). Endereço de doação placeholder para exercitar o link; a base "/" roda sem ele.
  # E2E_PORT_OFFSET=1 desloca a porta derivada como em `make e2e-pages` (#124). Local: `make e2e-pages`.
  e2e-pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SITE_BASE: /voto-a-voto-oss/
      PUBLIC_DONATION_URL: https://doacao.example.test/apoie
      E2E_PORT_OFFSET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Behaviour only: route smoke, scoped search, 390 px layout. Screenshot captures are per checkpoint and not run in CI.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-pages
          path: web/test-results
