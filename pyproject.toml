[project]
name = "voto-a-voto"
version = "0.1.0"
description = "Brazilian election results, vote by vote: TSE data pipeline and a static, verifiable results site."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tse-scrape = "voto_a_voto.tse_scrape:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
