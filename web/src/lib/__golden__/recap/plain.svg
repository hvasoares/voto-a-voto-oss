<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1283" viewBox="0 0 1080 1283" role="img"><title>Em São Paulo, no 2º turno, estes foram os votos dados a candidatos: em 2018, Lula teve 45,0% e Bolsonaro teve 55,0%; em 2022, Lula teve 47,8% e Bolsonaro teve 52,2%; em 2026, Lula teve 51,2% e Bolsonaro teve 48,8%.</title><rect x="0" y="0" width="1080" height="1283" fill="#faf7f0"/><rect x="5" y="5" width="1070" height="1273" fill="none" stroke="#1c1b18" stroke-width="10"/><text x="98" y="105" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#1c1b18">Em São Paulo, no 2º turno, estes foram os votos</text><text x="98" y="151.8" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#1c1b18">dados a candidatos: em 2018, Lula teve 45,0% e</text><text x="98" y="198.60000000000002" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#1c1b18">Bolsonaro teve 55,0%; em 2022, Lula teve 47,8% e</text><text x="98" y="245.40000000000003" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#1c1b18">Bolsonaro teve 52,2%; em 2026, Lula teve 51,2% e</text><text x="98" y="292.20000000000005" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="36" fill="#1c1b18">Bolsonaro teve 48,8%.</text><text x="98" y="391.00000000000006" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1c1b18">2018</text><text x="248" y="391.00000000000006" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#6a6558">Ponto de partida da série</text><rect x="98" y="411.00000000000006" width="397.8" height="100" fill="#b02b27"/><rect x="495.8" y="411.00000000000006" width="486.2" height="100" fill="#0c54a0"/><text x="296.9" y="475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="