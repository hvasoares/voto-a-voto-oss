="1376" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">32</text><text x="98" y="1416" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558">Escala em %: 17, 20, 23, 26, 29, 32</text><text x="98" y="1468" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#6a6558">Cada estado mostra a parcela do seu eleitorado que não votou</text><text x="98" y="1508" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#6a6558">em ninguém: abstenção, brancos e nulos somados. O exterior</text><text x="98" y="1548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#6a6558">não aparece como estado.</text><text x="98" y="1612" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#1c1b18">exemplo.test/mapa/ficaram-em-casa</text><text x="98" y="1664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#6a6558">Voto a Voto · Dados fictícios. Fonte real: TSE.</text></svg>