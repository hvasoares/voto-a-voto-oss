<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img"><title>Não há dados do 1º turno de 2026 neste conjunto.</title><rect x="0" y="0" width="1080" height="1620" fill="#faf7f0"/><rect x="5" y="5" width="1070" height="1610" fill="none" stroke="#1c1b18" stroke-width="10"/><text x="98" y="133" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="64" fill="#1c1b18">Ficaram em casa</text><text x="98" y="203" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#6a6558">Quem não votou em ninguém (abstenção, brancos e</text><text x="98" y="249" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#6a6558">nulos). 1º turno de 2026.</text><rect x="98" y="1188" width="126.28571428571429" height="40" fill="#eef3f1" stroke="#d9d3c3" stroke-width="1"/><rect x="224.28571428571428" y="1188" width="126.28571428571429" height="40" fill="#cfe0e0" stroke="#d9d3c3" stroke-width="1"/><rect x="350.57142857142856" y="1188" width="126.28571428571429" height="40" fill="#a5c6ca" stroke="#d9d3c3" stroke-width="1"/><rect x="476.8571428571429" y="1188" width="126.28571428571429" height="40" fill="#74a5ad" stroke="#d9d3c3" stroke-width="1"/><rect x="603.1428571428571" y="1188" width="126.28571428571429" height="40" fill="#38707d" stroke="#d9d3c3" stroke-width="1"/><rect x="729.4285714285714" y="1188" width="126.28571428571429" height="40" fill="#24606c" stroke="#d9d3c3" stroke-width="1"/><rect x="855.7142857142858" y="1188" width="126.28571428571429" height="40" fill="#14404b" stroke="#d9d3c3" stroke-width="1"/><text x="224.28571428571428" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">17</text><text x="350.57142857142856" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">20</text><text x="476.8571428571429" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">23</text><text x="603.1428571428571" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">26</text><text x="729.4285714285714" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">29</text><text x="855.7142857142858" y="1262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558" text-anchor="middle">32</text><text x="98" y="1302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6a6558">Escala em %: 17, 20, 23, 26, 29, 32</text><text x="98" y="1354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#6a6558">Cada estado mostra a parcela do seu eleitorado que não votou</text><text x="98" y="1394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#6a6558">em ninguém: abstenção, brancos e nulos somados. O exterior</text><text x="98" y="1434" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#6a6558">não aparece como estado.</text><text x="98" y="1498" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#1c1b18">exemplo.test/mapa/ficaram-em-casa</text><text x="98" y="1550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#6a6558">Voto a Voto · Fonte: TSE</text></svg>